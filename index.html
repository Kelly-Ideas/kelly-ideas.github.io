<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelly Ideas</title>
  <link rel="icon" type="image/svg+xml" href="./kmito/favicon.svg" />
  <style>
    :root { --bg: #0B0F17; --card: #131B2E; --border: rgba(255,255,255,0.09); --text: #F8FAFC; --muted: #94A3B8; --accent: #10B981; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 40px 16px; }
    .container { max-width: 560px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 30px; }
    p.lead { margin: 0 0 24px; color: var(--muted); }
    .app { display: flex; gap: 16px; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; }
    .app img { width: 56px; height: 56px; border-radius: 14px; flex: none; }
    .app h2 { margin: 0; font-size: 20px; }
    .app h2 a { color: var(--text); text-decoration: none; }
    .links { font-size: 14px; color: var(--muted); }
    .links a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Kelly Ideas</h1>
    <p class="lead">Small Android apps.</p>
    <div class="app">
      <img src="./kmito/icon-192.png" alt="" />
      <div>
        <h2><a href="./kmito/">Kmito</a></h2>
        <div class="links">
          <a href="./kmito/">Download</a> · <a href="./kmito/privacy/">Privacy policy</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
