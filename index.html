<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizLock — Kelly Ideas OTA & Public Portal</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    :root {
      --bg: #0B0F17;
      --card: #131B2E;
      --border: rgba(255, 255, 255, 0.09);
      --text: #F8FAFC;
      --muted: #94A3B8;
      --accent: #10B981;
      --accent-hover: #059669;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 40px 16px;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 28px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      margin: 0 0 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: var(--accent);
      color: #042f2e;
      font-weight: 800;
      font-size: 16px;
      padding: 15px 20px;
      border-radius: 14px;
      text-decoration: none;
      transition: background 0.15s ease;
      margin-bottom: 12px;
    }
    .btn:hover { background: var(--accent-hover); color: #fff; }
    .meta-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      margin-bottom: 24px;
    }
    .links {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 14px;
    }
    .links a {
      color: var(--accent);
      text-decoration: none;
    }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="container">
    <span class="badge">Kelly Ideas</span>
    <h1>QuizLock</h1>
    <p>Solve logic, math, physics, chess, and coding challenges to earn mindful screen time.</p>

    <a class="btn" href="./ota/QuizLock-latest.apk" download>
      Download Latest Sideload APK
    </a>

    <div class="meta-box" id="version-info">
      Channel: Unrestricted Sideload OTA · Latest Build: v1.0.32
    </div>

    <div class="links">
      <a href="./privacy">Privacy Policy</a>
      <a href="./ota/latest.json">OTA Metadata</a>
      <a href="./packs.json">Packs Catalog</a>
    </div>
  </main>
  <script>
    fetch('./ota/latest.json')
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && data.tag_name) {
          document.getElementById('version-info').textContent =
            'Channel: Unrestricted Sideload OTA · Latest Build: ' + data.tag_name + ' (code ' + data.version_code + ')';
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
